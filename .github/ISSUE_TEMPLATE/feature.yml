name: Feature request
description: Something tdeemon should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Issues are public. Leave out personal data such as your weights and
        meals, and secrets such as keys and tokens.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
