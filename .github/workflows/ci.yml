# The checks every pull request must pass; the same targets run locally
# with `make check`. The tool versions come from mise.toml and mise.lock.
#
# Caches are written only by pushes to main and only read by pull
# requests, so pull requests cannot fill the repository's 10 GB of cache
# and push out main's.
#
# Each job installs only the tools it runs (install_args), so a download
# that fails for one tool cannot fail an unrelated job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  # make runs every tool through mise exec, which would otherwise install
  # the tools a job left out.
  MISE_EXEC_AUTO_INSTALL: "false"
  # A Go module or a Go tool that the proxy fails to serve is fetched from
  # its source instead; the checksum database still verifies it.
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request cancels its running run. On main a run
  # that has started is never cancelled; a newer push replaces only a run
  # still waiting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: >-
            go golangci-lint
            go:golang.org/x/vuln/cmd/govulncheck
            go:github.com/vladopajic/go-test-coverage/v2
          # Only main saves the tool cache; pull requests read it.
          cache_save: ${{ github.event_name == 'push' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # A new key per run, so main's build cache stays current.
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - run: make lint-go
      - run: make test-go
        env:
          # Run every test, with the race detector, even if the cache has
          # a result for it.
          GOFLAGS: -count=1
      - run: make audit-go
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  web:
    name: Web app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: node go golangci-lint
          # Only main saves the tool cache; pull requests read it.
          cache_save: ${{ github.event_name == 'push' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/go/pkg/mod
            ~/.cache/go-build
          # yamllint disable-line rule:line-length
          key: web-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/codegen/package-lock.json', 'go.sum') }}-${{ github.run_id }}
          restore-keys: |
            web-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/codegen/package-lock.json', 'go.sum') }}-
            web-${{ runner.os }}-
      - run: make lint-web
      - run: make test-web
      - run: make api
      # The files behind the webui build tag need the built app: lint them,
      # and run their tests.
      - run: make lint-webui
      - run: make test-webui
        env:
          GOFLAGS: -count=1
      - run: make audit-npm
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/go/pkg/mod
            ~/.cache/go-build
          # yamllint disable-line rule:line-length
          key: web-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/codegen/package-lock.json', 'go.sum') }}-${{ github.run_id }}

  other:
    name: Other files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: >-
            editorconfig-checker hadolint shellcheck actionlint zizmor
            uv python pipx:sqlfluff pipx:yamllint
            node npm:markdownlint-cli2 cocogitto
          # Only main saves the tool cache; pull requests read it.
          cache_save: ${{ github.event_name == 'push' }}
      # zizmor's online audits (impostor commits, actions with known
      # vulnerabilities) read public data with the job's read-only token.
      - run: make lint-other
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make test-scripts

  dependencies:
    name: Dependencies and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history, not only the last commit.
          fetch-depth: 0
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: gitleaks osv-scanner
          # Only main saves the tool cache; pull requests read it.
          cache_save: ${{ github.event_name == 'push' }}
      - run: make secrets
      - run: make licenses

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pinned like everything else, not buildx's moving tag.
          # yamllint disable-line rule:line-length
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      # Built, with the tests the Dockerfile runs, but not pushed; releases
      # publish the image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
