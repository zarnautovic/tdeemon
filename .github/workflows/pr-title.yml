# The title of a pull request becomes its squash-merge commit, so it must
# be a Conventional Commit: the release tooling reads it.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: cocogitto
          # This workflow runs on pull requests only, which must not write
          # caches (see ci.yml).
          cache: false
      # cog verify reads an author from the git config and aborts without
      # one; the runner's checkout has none.
      - run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # After --, a title such as "--help" is a message, not an option.
      - run: cog verify -- "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
