# Every merge to main that brings a feat, fix or perf commit, or a
# breaking change, cuts a release: the next version from the
# Conventional Commits since the last tag (scripts/next-version.sh,
# cog.toml), a vX.Y.Z tag, a GitHub Release with the notes, and the
# image ghcr.io/zarnautovic/tdeemon:X.Y.Z (also :X.Y and :sha-<commit>).
#
# The image is a job here, not a workflow of its own on the release: a
# release the workflow's token makes starts no other workflow.
name: Release

on:
  push:
    branches: [main]

permissions: {}

# One run at a time. A newer merge replaces a run still waiting, and the
# release it makes includes that run's commits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, and every commit since the last one.
          fetch-depth: 0
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: cocogitto
          # One tool, quicker to download than to keep in the cache.
          cache: false
      - name: Next version and notes
        id: next
        run: |
          # cog reads an author from the git config and aborts without one.
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version=$(scripts/next-version.sh)
          if [[ -z $version ]]; then
            echo "Nothing since the last release makes one: no feat, fix or perf commit and no breaking change."
            exit 0
          fi
          echo "Releasing $version"
          # A local tag, for cog changelog to cut the notes at; the
          # release job creates the real one.
          git tag "$version"
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "version=$version"
            echo "notes<<$delimiter"
            cog changelog --at "$version"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that can write to the repository, and it runs no
    # action: only gh.
    permissions:
      contents: write # create the version tag and the GitHub Release
    steps:
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "$NOTES"

  image:
    name: Image
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    env:
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            scripts/image-tags.sh "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pinned like everything else, not buildx's moving tag.
          # yamllint disable-line rule:line-length
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The Dockerfile cross-compiles, so both platforms build without
      # emulation; the tests in it run once, on the build machine.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            GOPROXY=${{ env.GOPROXY }}
          provenance: mode=max
          # The SBOM's scanner pinned like BuildKit, not its moving default.
          # yamllint disable-line rule:line-length
          sbom: generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          # No cache: a release builds from its sources alone.
