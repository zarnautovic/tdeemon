# Every merge to main that brings a feat, fix or perf commit, or a
# breaking change, cuts a release: the next version from the
# Conventional Commits since the last tag (scripts/next-version.sh,
# cog.toml), a vX.Y.Z tag and a GitHub Release with the notes.
name: Release

on:
  push:
    branches: [main]

permissions: {}

# One run at a time. A newer merge replaces a run still waiting, and the
# release it makes includes that run's commits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, and every commit since the last one.
          fetch-depth: 0
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: cocogitto
          # Only one tool: a cache saved here would shadow CI's full one.
          cache: false
      - name: Next version and notes
        id: next
        run: |
          # cog reads an author from the git config and aborts without one.
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version=$(scripts/next-version.sh)
          if [[ -z $version ]]; then
            echo "Nothing since the last release makes one: no feat, fix or perf commit and no breaking change."
            exit 0
          fi
          echo "Releasing $version"
          # A local tag, for cog changelog to cut the notes at; the
          # release job creates the real one.
          git tag "$version"
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "version=$version"
            echo "notes<<$delimiter"
            cog changelog --at "$version"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that can write, and it runs no action: only gh.
    permissions:
      contents: write # create the version tag and the GitHub Release
    steps:
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "$NOTES"
