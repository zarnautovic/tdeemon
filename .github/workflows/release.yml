# Every merge to main that brings a feat, fix or perf commit cuts a
# release: the next version from the Conventional Commits since the last
# tag (cog.toml), a vX.Y.Z tag and a GitHub Release with the notes.
name: Release

on:
  push:
    branches: [main]

permissions: {}

# One release at a time, in merge order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the version tag and the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, and every commit since the last one.
          fetch-depth: 0
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: cocogitto
          # Only one tool: a cache saved here would shadow CI's full one.
          cache: false
      - name: Next version
        id: next
        run: |
          # cog reads an author from the git config and aborts without one.
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          next=$(cog bump --auto --dry-run 2>/dev/null | head -n 1)
          if [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "Releasing $next"
          else
            echo "No feat, fix or perf commit since the last release; nothing to release."
          fi
      - name: Tag and GitHub Release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "$VERSION"
          cog changelog --at "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
