# Coverage thresholds for the Go tests, checked by go-test-coverage in
# make test-go (and so in CI). The rules: docs/conventions.md ("Tests").
profile: coverage.out

threshold:
  file: 0
  package: 75
  total: 75

override:
  # The domain and the boundaries where input enters: configuration, the
  # API, the tool registry and MCP, credentials (auth), the ingest of
  # devices' data and the import of the predecessor's history, with their
  # subpackages. A new boundary
  # (the chat) is added here. The pattern matches package
  # paths only (a directory with a dot in its name is not matched):
  # overrides apply to files too, and a file below 90 % would fail the run
  # without a line saying why. A test helper package inside a boundary
  # goes under exclude, like storetest.
  - path: ^internal/(domain|tools|api|mcp|config|auth|ingest|history)(/[^/.]+)*$
    threshold: 90

exclude:
  paths:
    # A test helper, exercised by the tests that use it.
    - ^internal/store/storetest/
