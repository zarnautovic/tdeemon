# Conventional Commits, checked by cocogitto: `cog verify` in the
# commit-msg hook (lefthook.yml) and on every pull request title (the
# "PR title" workflow), since the title becomes the squash-merge commit.
# The commit types are cocogitto's defaults: feat, fix, perf, refactor,
# test, docs, ci, build, chore, style and revert; `!` marks a breaking
# change. Merge commits are let through by the hook alone (it passes
# --ignore-merge-commits): here it would also let any title starting
# with "Merge " pass the PR title check, and the release skip it.
#
# The release workflow takes the next version from these commits
# (scripts/next-version.sh): feat raises the minor version, fix and perf
# the patch, and a breaking change the major. Before 1.0.0 a breaking
# change raises the minor instead; cog does that only for feat, so the
# script does it for every type. The other types make no release.
tag_prefix = "v"

# The release notes link each commit, and the comparison with the
# previous release, on GitHub; a breaking change gets a BREAKING badge.
[changelog]
template = "remote"
remote = "github.com"
owner = "zarnautovic"
repository = "tdeemon"

[commit_types]
perf = { changelog_title = "Performance Improvements", bump_patch = true }
