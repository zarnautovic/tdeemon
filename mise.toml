# Toolchain pinned for everyone working on the repo: `mise install`.
[tools]
go = "1.27.3"
# LTS line the web build and code generation run on. Node 26 becomes the
# active LTS on 2026-10-28; move to it then.
node = "24.22.0"
# Lint and format for Go (staticcheck, gofumpt and goimports inside);
# configuration in .golangci.yml, rules in docs/conventions.md.
golangci-lint = "2.15.0"
# Linters for the other files; configuration next to the repo root,
# rules in docs/conventions.md ("Other files").
editorconfig-checker = "4.0.2"
hadolint = "2.15.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
shellcheck = "0.11.0"
# uv and Python run the Python tools below. Python 3.15 waits for
# wheels (pyyaml has none yet).
uv = "0.13.1"
python = "3.14.8"
"pipx:yamllint" = "1.38.0"
"pipx:sqlfluff" = "4.4.0"
"npm:markdownlint-cli2" = "0.23.3"
# Git hooks (lefthook.yml): `lefthook install` once per clone.
lefthook = "2.2.2"
