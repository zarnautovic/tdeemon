<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      The browser's bar in the page's colour (--background in src/index.css);
      src/lib/theme.ts picks one for a theme chosen.
    -->
    <meta
      name="theme-color"
      data-scheme="light"
      media="(prefers-color-scheme: light)"
      content="#F5F6F8"
    />
    <meta
      name="theme-color"
      data-scheme="dark"
      media="(prefers-color-scheme: dark)"
      content="#0A0E15"
    />
    <!--
      The app installed (vite.config.ts writes its manifest): its icons,
      and on iOS, which reads neither the manifest's icons nor its name,
      the home screen's icon, title and a page of its own.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="tdeemon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>tdeemon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
